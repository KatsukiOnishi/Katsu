<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さとやまコーヒー 取り置き予約</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f5f0eb;
      color: #2c1a0e;
      min-height: 100vh;
    }
    header {
      background: #3b1f0a;
      color: #f5e6d3;
      text-align: center;
      padding: 24px 16px 18px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .05em; }
    header p { margin-top: 5px; font-size: .82rem; opacity: .75; }

    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

    /* セクションタイトル */
    .section-title {
      font-size: .9rem; font-weight: 700; color: #5c3317;
      margin: 20px 0 10px; display: flex; align-items: center; gap: 6px;
    }
    .step-badge {
      width: 22px; height: 22px; border-radius: 50%;
      background: #8b4513; color: #fff;
      font-size: .72rem; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* 拠点カード */
    .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .store-card {
      background: #fff; border-radius: 10px; padding: 14px 12px;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s, box-shadow .15s; text-align: center;
      font-size: .9rem; font-weight: 600;
    }
    .store-card:hover { border-color: #c07040; }
    .store-card.selected { border-color: #8b4513; background: #fff8f2; }

    /* 商品グリッド */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .product-card {
      background: #fff; border-radius: 10px; padding: 14px 12px;
      border: 2px solid transparent;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
    }
    .product-card.has-stock { cursor: pointer; }
    .product-card.has-stock:hover { border-color: #c07040; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .product-card.in-cart { border-color: #8b4513; background: #fff8f2; }
    .product-card.sold-out { opacity: .45; cursor: not-allowed; }
    .product-name { font-size: .88rem; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
    .product-stock { font-size: .78rem; color: #888; }
    .product-stock.low { color: #c0392b; font-weight: 600; }
    .stock-badge { display: inline-block; background: #fdf0e8; border-radius: 20px; padding: 2px 10px; }
    .product-flavor-note { font-size: .92rem; color: #c0660d; font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
    .product-lot-info { font-size: .72rem; color: #8b6f4e; margin: 2px 0 4px; }
    .product-description { font-size: .78rem; color: #555; margin: 6px 0; line-height: 1.5; white-space: pre-wrap; }

    /* カート内数量コントロール */
    .qty-control {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 10px;
    }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid #c07040; background: #fff;
      color: #8b4513; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .1s;
    }
    .qty-btn:hover { background: #fdf0e8; }
    .qty-display { font-size: 1rem; font-weight: 700; min-width: 24px; text-align: center; color: #3b1f0a; }

    /* カートサマリ */
    .cart-summary {
      background: #fff8f2; border: 1.5px solid #e8c8a0;
      border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
      font-size: .88rem;
    }
    .cart-item { display: flex; justify-content: space-between; padding: 3px 0; }
    .cart-item-name { color: #3b1f0a; }
    .cart-item-qty { font-weight: 700; color: #8b4513; }
    .cart-empty { color: #bbb; text-align: center; font-size: .85rem; padding: 8px 0; }

    /* フォーム */
    .form-card {
      background: #fff; border-radius: 14px; padding: 22px 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); margin-top: 8px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .83rem; font-weight: 600; margin-bottom: 5px; color: #4a2a10; }
    input, select {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #d8c5b2; border-radius: 8px;
      font-size: .95rem; background: #fdfaf7; color: #2c1a0e;
      transition: border-color .15s;
    }
    input:focus, select:focus { outline: none; border-color: #8b4513; }
    .availability-info { font-size: .82rem; margin-top: 6px; min-height: 18px; }
    .avail-ok { color: #27ae60; }
    .avail-ng { color: #c0392b; font-weight: 600; }

    button[type="submit"] {
      width: 100%; padding: 13px;
      background: #8b4513; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: background .15s;
    }
    button[type="submit"]:hover { background: #6b330f; }
    button[type="submit"]:disabled { background: #bbb; cursor: not-allowed; }

    /* 完了画面 */
    .complete-card {
      background: #fff; border-radius: 14px; padding: 30px 22px;
      text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    .complete-icon { font-size: 2.8rem; margin-bottom: 10px; }
    .complete-card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: #3b1f0a; }
    .complete-details {
      text-align: left; background: #fdfaf7; border-radius: 8px;
      padding: 14px 16px; margin: 14px 0; font-size: .88rem; line-height: 2;
    }
    .complete-details .label { color: #888; font-size: .78rem; }
    .complete-note { font-size: .8rem; color: #666; margin-top: 10px; line-height: 1.7; }
    .back-btn {
      display: inline-block; margin-top: 18px; padding: 10px 24px;
      background: #f0e4d4; color: #3b1f0a; border: none;
      border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer;
    }
    .back-btn:hover { background: #e0d0bc; }

    .error-msg { background: #fef0f0; border-radius: 8px; padding: 11px 13px; color: #c0392b; font-size: .85rem; margin-bottom: 12px; }
    .loading { text-align: center; padding: 24px; color: #888; font-size: .9rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h1>☕ さとやまコーヒー</h1>
  <p>取り置き予約 — 商品を選んでご予約ください</p>
</header>

<main>

  <!-- Step 1: 拠点選択 -->
  <div class="section-title"><span class="step-badge">1</span>受け取り拠点を選ぶ</div>
  <div class="store-grid" id="store-grid">
    <div class="loading" style="grid-column:1/-1">読み込み中...</div>
  </div>

  <!-- Step 2: 商品選択 -->
  <div id="product-section" class="hidden">
    <div class="section-title"><span class="step-badge">2</span>商品を選ぶ</div>
    <div class="loading hidden" id="product-loading">読み込み中...</div>
    <div class="product-grid" id="product-grid"></div>
  </div>

  <!-- Step 3: カートと予約フォーム -->
  <div id="form-section" class="hidden">
    <div class="section-title"><span class="step-badge">3</span>予約情報を入力する</div>

    <div class="cart-summary" id="cart-summary">
      <div class="cart-empty" id="cart-empty">商品をカートに入れてください</div>
    </div>

    <div class="form-card">
      <div id="form-error" class="error-msg hidden"></div>
      <form id="reservation-form">
        <div class="form-group">
          <label>お名前 <span style="color:#c0392b">*</span></label>
          <input type="text" id="customer_name" placeholder="山田 太郎" required>
        </div>
        <div class="form-group">
          <label>メールアドレス <span style="color:#c0392b">*</span></label>
          <input type="email" id="customer_email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>受け取り日 <span style="color:#c0392b">*</span></label>
          <input type="date" id="pickup_date" required>
          <div class="availability-info" id="availability-info"></div>
        </div>
        <button type="submit" id="submit-btn" disabled>取り置きを予約する</button>
      </form>
    </div>
  </div>

  <!-- 完了画面 -->
  <div class="complete-card hidden" id="complete-section">
    <div class="complete-icon">✅</div>
    <h2>取り置きが完了しました</h2>
    <div class="complete-details" id="complete-details"></div>
    <p class="complete-note">
      確認メールをお送りしました。<br>
      ご来店の際は受付番号をお知らせください。<br>
      <span style="font-size:.78rem;color:#aaa">キャンセルはメール内のリンクから行えます（受取日前日まで）。</span>
    </p>
    <button class="back-btn" onclick="resetAll()">続けて予約する</button>
  </div>

</main>

<script>
  // ---- 状態 ----
  let stores = [];
  let selectedStore = null;
  let products = [];
  let cart = {};          // { product_id: quantity }
  let availabilityTimer = null;

  // ---- 初期化 ----
  (async () => {
    setupDateRange();
    await loadStores();
    document.getElementById('pickup_date').addEventListener('change', debounce(checkAvailability, 500));
  })();

  // ---- 日付設定 ----
  function setupDateRange() {
    const el = document.getElementById('pickup_date');
    const today = new Date();
    const twoWeeks = new Date(today);
    twoWeeks.setDate(today.getDate() + 14);
    el.min = fmt(today);
    el.max = fmt(twoWeeks);
  }
  function fmt(d) { return d.toISOString().split('T')[0]; }
  function fmtJp(s) {
    const [y, m, d] = s.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  // ---- 拠点 ----
  async function loadStores() {
    const res = await fetch('/api/stores');
    const data = await res.json();
    stores = data.stores || [];
    renderStores();
  }

  function renderStores() {
    const grid = document.getElementById('store-grid');
    grid.innerHTML = '';
    for (const s of stores) {
      const card = document.createElement('div');
      card.className = 'store-card';
      card.textContent = s.name;
      card.onclick = () => selectStore(s, card);
      grid.appendChild(card);
    }
    if (stores.length === 0) {
      grid.innerHTML = '<p style="color:#aaa;font-size:.9rem">拠点情報を取得できませんでした</p>';
    }
  }

  async function selectStore(store, card) {
    document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedStore = store;
    cart = {};
    document.getElementById('product-section').classList.remove('hidden');
    document.getElementById('form-section').classList.add('hidden');
    await loadProducts();
  }

  // ---- 商品 ----
  async function loadProducts() {
    document.getElementById('product-loading').classList.remove('hidden');
    document.getElementById('product-grid').innerHTML = '';
    try {
      const res = await fetch(`/api/inventory?store_id=${selectedStore.id}`);
      const data = await res.json();
      products = data.products || [];
      renderProducts();
    } catch {
      document.getElementById('product-grid').innerHTML = '<p style="color:#c0392b;font-size:.88rem">在庫情報の取得に失敗しました</p>';
    } finally {
      document.getElementById('product-loading').classList.add('hidden');
    }
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderProducts() {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';
    for (const p of products) {
      const qty = cart[p.product_id] || 0;
      const inCart = qty > 0;
      const soldOut = p.stock === 0;
      const card = document.createElement('div');
      card.id = `product-card-${p.product_id}`;
      card.className = `product-card ${soldOut ? 'sold-out' : 'has-stock'} ${inCart ? 'in-cart' : ''}`;
      const lowStock = p.stock > 0 && p.stock <= 5;
      const flavorNote = (p.flavor_note || '').trim();
      const lotInfo = (p.lot_info || '').trim();
      const description = (p.description || '').trim();
      card.innerHTML = `
        ${flavorNote ? `<div class="product-flavor-note">${escapeHtml(flavorNote)}</div>` : ''}
        ${lotInfo ? `<div class="product-lot-info">${escapeHtml(lotInfo)}</div>` : ''}
        <div class="product-name">${escapeHtml(p.name)}</div>
        ${description ? `<div class="product-description">${escapeHtml(description)}</div>` : ''}
        <div class="product-stock ${lowStock ? 'low' : ''}">
          <span class="stock-badge">${soldOut ? '在庫なし' : `残り ${p.stock} 個`}</span>
        </div>
        ${!soldOut ? `
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${p.product_id}, -1)" ${qty === 0 ? 'disabled' : ''}>−</button>
          <span class="qty-display" id="qty-${p.product_id}">${qty}</span>
          <button class="qty-btn" onclick="changeQty(${p.product_id}, 1)" ${qty >= Math.min(p.stock, 10) ? 'disabled' : ''}>＋</button>
        </div>` : ''}
      `;
      grid.appendChild(card);
    }
  }

  function changeQty(productId, delta) {
    const p = products.find(x => x.product_id === productId);
    if (!p) return;
    const current = cart[productId] || 0;
    const next = Math.max(0, Math.min(current + delta, Math.min(p.stock, 10)));
    if (next === 0) {
      delete cart[productId];
    } else {
      cart[productId] = next;
    }
    renderProducts();
    renderCart();
    checkAvailability();
  }

  // ---- カート ----
  function renderCart() {
    const summary = document.getElementById('cart-summary');
    const empty = document.getElementById('cart-empty');
    const formSection = document.getElementById('form-section');
    const submitBtn = document.getElementById('submit-btn');
    const cartItems = Object.entries(cart).filter(([, q]) => q > 0);

    if (cartItems.length === 0) {
      empty.style.display = '';
      formSection.classList.add('hidden');
      submitBtn.disabled = true;
      // カートの商品行を消す
      summary.querySelectorAll('.cart-item').forEach(el => el.remove());
      return;
    }

    empty.style.display = 'none';
    formSection.classList.remove('hidden');

    // 既存の cart-item を消してから再描画
    summary.querySelectorAll('.cart-item').forEach(el => el.remove());
    for (const [pid, qty] of cartItems) {
      const p = products.find(x => x.product_id === parseInt(pid));
      if (!p) continue;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `<span class="cart-item-name">${p.name}</span><span class="cart-item-qty">${qty}個</span>`;
      summary.appendChild(row);
    }

    submitBtn.disabled = !document.getElementById('pickup_date').value;
  }

  // ---- 在庫確認 ----
  async function checkAvailability() {
    const date = document.getElementById('pickup_date').value;
    const info = document.getElementById('availability-info');
    const submitBtn = document.getElementById('submit-btn');
    const cartItems = Object.entries(cart).filter(([, q]) => q > 0);

    if (!date || !selectedStore || cartItems.length === 0) {
      info.textContent = '';
      submitBtn.disabled = cartItems.length === 0;
      return;
    }

    info.textContent = '確認中...';
    info.className = 'availability-info';
    submitBtn.disabled = true;

    try {
      const items = cartItems.map(([pid, qty]) => {
        const p = products.find(x => x.product_id === parseInt(pid));
        return { product_id: parseInt(pid), product_name: p?.name ?? '', quantity: qty };
      });

      const res = await fetch('/api/availability', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ store_id: selectedStore.id, pickup_date: date, items }),
      });
      const data = await res.json();

      if (data.ok) {
        info.textContent = 'この日はご予約いただけます ✓';
        info.className = 'availability-info avail-ok';
        submitBtn.disabled = false;
      } else {
        const msgs = data.conflicts.map(c => `「${c.product_name}」残り${c.available}個`);
        info.textContent = `在庫不足: ${msgs.join('、')}`;
        info.className = 'availability-info avail-ng';
        submitBtn.disabled = true;
      }
    } catch {
      info.textContent = '';
      submitBtn.disabled = false;
    }
  }

  function debounce(fn, ms) {
    return function(...args) {
      clearTimeout(availabilityTimer);
      availabilityTimer = setTimeout(() => fn(...args), ms);
    };
  }

  // ---- 予約送信 ----
  document.getElementById('reservation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '送信中...';

    const cartItems = Object.entries(cart).filter(([, q]) => q > 0).map(([pid, qty]) => {
      const p = products.find(x => x.product_id === parseInt(pid));
      return { product_id: parseInt(pid), product_name: p?.name ?? '', quantity: qty };
    });

    const body = {
      store_id: selectedStore.id,
      customer_name: document.getElementById('customer_name').value.trim(),
      customer_email: document.getElementById('customer_email').value.trim(),
      pickup_date: document.getElementById('pickup_date').value,
      items: cartItems,
    };

    try {
      const res = await fetch('/api/reservations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || '予約に失敗しました'); return; }
      showComplete(data.reservation);
    } catch {
      showError('通信エラーが発生しました。もう一度お試しください。');
    } finally {
      btn.disabled = false;
      btn.textContent = '取り置きを予約する';
    }
  });

  function showError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function hideError() { document.getElementById('form-error').classList.add('hidden'); }

  function showComplete(reservation) {
    document.getElementById('form-section').classList.add('hidden');
    document.getElementById('product-section').classList.add('hidden');
    const section = document.getElementById('complete-section');
    section.classList.remove('hidden');

    const itemsHtml = reservation.items.map(i =>
      `<div><span class="label">商品</span><br>${i.product_name} × ${i.quantity}個</div>`
    ).join('');

    document.getElementById('complete-details').innerHTML = `
      <div><span class="label">受付番号</span><br><strong>#${reservation.id}</strong></div>
      <div><span class="label">受取拠点</span><br>${reservation.store_name}</div>
      <div><span class="label">受け取り日</span><br>${fmtJp(reservation.pickup_date)}</div>
      ${itemsHtml}
      <div><span class="label">確認メール送信先</span><br>${reservation.customer_email}</div>
    `;
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetAll() {
    cart = {};
    selectedStore = null;
    document.getElementById('complete-section').classList.add('hidden');
    document.getElementById('form-section').classList.add('hidden');
    document.getElementById('product-section').classList.add('hidden');
    document.getElementById('reservation-form').reset();
    document.getElementById('availability-info').textContent = '';
    document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
